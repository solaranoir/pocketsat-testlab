name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

  test:
    # Simulation results must be byte-identical across platforms (ADR-0006), so the
    # full suite runs on both Linux and macOS.
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Pytest
        run: uv run pytest

  slow-tests:
    # Multi-orbit story and integration tests, marked `slow` and skipped by a plain
    # `pytest` run. They run on every PR in parallel with the fast suite (#78).
    name: Slow tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Pytest (slow)
        run: uv run pytest -m slow
